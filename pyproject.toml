[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dslr"
version = "0.1.0"
description = "Disjoint row-sparse plus low-rank decomposition"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
